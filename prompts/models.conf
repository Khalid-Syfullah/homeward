# Which model and effort build each phase.
# Format: <phase number or full name> <fable|opus|sonnet> [low|medium|high|xhigh|max]
# Phases not listed use DEFAULT_MODEL (sonnet) and DEFAULT_EFFORT (medium) from config.env.
# fable = Claude Fable 5.1 (the shader work); opus = Opus 5.5; sonnet = Sonnet 5.5.
# If Fable is not available on your account, change line 04 to: 04 opus max
# Sonnet lines stay at high or below; available effort levels depend on the model (the skill falls back to high).
01 opus   high    # setup, story map, placeholders
02 opus   xhigh   # art import and join check
03 opus   xhigh   # scroll clock, frame store, WebGL compositor
04 fable  max     # the three joins (shader work)
05 sonnet high    # chapters 1 to 4
06 sonnet high    # chapters 5 to 10
07 sonnet high    # chrome, sound, accessibility
08 opus   max     # phones, performance, tests, production build
